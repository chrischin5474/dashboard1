<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#A0A5B5" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD269"/>
      <stop offset="100%" stop-color="#FF9F43"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Golden Coins -->
  <g filter="url(#shadow)">
    <!-- Coin 1 (Back) -->
    <circle cx="85" cy="145" r="28" fill="url(#coinGrad)"/>
    <circle cx="85" cy="145" r="20" fill="none" stroke="#FFA000" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="85" y="153" font-size="24" font-weight="900" fill="#FFA000" text-anchor="middle">$</text>

    <!-- Coin 2 (Front) -->
    <circle cx="135" cy="155" r="32" fill="url(#coinGrad)"/>
    <circle cx="135" cy="155" r="23" fill="none" stroke="#FF8F00" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="135" y="164" font-size="28" font-weight="900" fill="#FF8F00" text-anchor="middle">$</text>
  </g>

  <!-- Cute Price Tag -->
  <g transform="translate(100, 75) rotate(-15)" filter="url(#shadow)">
    <!-- Tag Shape -->
    <path d="M -45,-25 
             L 15,-25 
             L 45,5 
             L 15,35 
             L -45,35 
             Z" fill="url(#tagGrad)" rx="10"/>
    
    <!-- Tag Hole -->
    <circle cx="-30" cy="5" r="6" fill="#FFFFFF"/>
    
    <!-- String through the hole -->
    <path d="M -30,5 C -45,0 -60,-15 -50,-25" fill="none" stroke="#CFD8DC" stroke-width="3" stroke-linecap="round"/>

    <!-- Question Mark & Cute Face on Tag -->
    <!-- Large Question Mark -->
    <text x="5" y="16" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">?</text>
    
    <!-- Face details -->
    <!-- Eyes -->
    <circle cx="-15" cy="2" r="3" fill="#3E2723"/>
    <circle cx="-3" cy="2" r="3" fill="#3E2723"/>
    <!-- Blush -->
    <circle cx="-18" cy="6" r="3" fill="#FF8A80" opacity="0.8"/>
    <circle cx="0" cy="6" r="3" fill="#FF8A80" opacity="0.8"/>
    <!-- Smile -->
    <path d="M-10 6 q1 3 2 0" fill="none" stroke="#3E2723" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
