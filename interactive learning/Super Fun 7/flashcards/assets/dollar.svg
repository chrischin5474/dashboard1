<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#78909C" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="dollarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="100%" stop-color="#66BB6A"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#81C784"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Main Dollar Bill Group -->
  <g transform="translate(110, 110) rotate(-10)" filter="url(#shadow)">
    <!-- Outer Bill Border -->
    <rect x="-80" y="-50" width="160" height="100" rx="12" fill="url(#dollarGrad)" stroke="#2E7D32" stroke-width="4"/>
    
    <!-- Inner Pattern Border -->
    <rect x="-70" y="-40" width="140" height="80" rx="8" fill="url(#innerGrad)" stroke="#388E3C" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Corner $ Symbols -->
    <text x="-62" y="-22" font-size="14" font-weight="900" fill="#1B5E20" text-anchor="middle">$</text>
    <text x="62" y="-22" font-size="14" font-weight="900" fill="#1B5E20" text-anchor="middle">$</text>
    <text x="-62" y="32" font-size="14" font-weight="900" fill="#1B5E20" text-anchor="middle">$</text>
    <text x="62" y="32" font-size="14" font-weight="900" fill="#1B5E20" text-anchor="middle">$</text>

    <!-- Center Ornament Circle -->
    <ellipse cx="0" cy="0" rx="35" ry="30" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
    
    <!-- Big Center $ Sign -->
    <text x="0" y="11" font-size="34" font-weight="900" fill="#2C3E50" opacity="0.15" text-anchor="middle">$</text>

    <!-- Cute Smiley Face in the Center -->
    <!-- Eyes -->
    <circle cx="-12" cy="-4" r="4.5" fill="#1B5E20"/>
    <circle cx="12" cy="-4" r="4.5" fill="#1B5E20"/>
    
    <!-- Eye Highlights -->
    <circle cx="-14" cy="-6" r="1.5" fill="#FFFFFF"/>
    <circle cx="10" cy="-6" r="1.5" fill="#FFFFFF"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="-18" cy="3" rx="5" ry="3" fill="#FF8A80" opacity="0.9"/>
    <ellipse cx="18" cy="3" rx="5" ry="3" fill="#FF8A80" opacity="0.9"/>

    <!-- Happy Open Smile -->
    <path d="M -6,1 C -3,7 3,7 6,1" fill="none" stroke="#1B5E20" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
